AWSTemplateFormatVersion: 2010-09-09
Description: Observability 101 with AWS — serverless demo API with logs, metrics, and traces.

Transform:
  - AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true

Resources:
  GetAllItemsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-getAllItems'
      RetentionInDays: 7

  GetByIdLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-getById'
      RetentionInDays: 7

  PutItemLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-putItem'
      RetentionInDays: 7

  getAllItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-getAllItems'
      Handler: src/handlers/get-all-items.getAllItemsHandler
      Description: List items from DynamoDB (GET /).
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Sub '/aws/lambda/${AWS::StackName}-getAllItems'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SampleTable
      Environment:
        Variables:
          SAMPLE_TABLE: !Ref SampleTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: GET

  getByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-getById'
      Handler: src/handlers/get-by-id.getByIdHandler
      Description: Get item by id; demo scenarios via query param scenario (GET /{id}).
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Sub '/aws/lambda/${AWS::StackName}-getById'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SampleTable
      Environment:
        Variables:
          SAMPLE_TABLE: !Ref SampleTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /{id}
            Method: GET

  putItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-putItem'
      Handler: src/handlers/put-item.putItemHandler
      Description: Create or replace an item (POST /).
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Sub '/aws/lambda/${AWS::StackName}-putItem'
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref SampleTable
      Environment:
        Variables:
          SAMPLE_TABLE: !Ref SampleTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: POST

  SampleTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

  ObservabilityDemoSamplingRule:
    Type: AWS::XRay::SamplingRule
    Properties:
      SamplingRule:
        RuleName: obs101-demo-api-100pct
        Priority: 1
        FixedRate: 1.0
        ReservoirSize: 5
        ServiceName: '*'
        ServiceType: '*'
        Host: '*'
        HTTPMethod: '*'
        URLPath: '*'
        Version: 1
        ResourceARN: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${ServerlessRestApi}/stages/Prod'

  GetByIdDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-getById-duration-high'
      AlarmDescription: Demo signal when getById Lambda duration exceeds 2 seconds (latency scenario).
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref getByIdFunction
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ObservabilityDemoDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-observability-demo'
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "getById invocations",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/Lambda", "Invocations", "FunctionName", "${GetByIdFunctionName}", { "stat": "Sum" } ]
                  ],
                  "period": 60
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 0,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "getById errors",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/Lambda", "Errors", "FunctionName", "${GetByIdFunctionName}", { "stat": "Sum" } ]
                  ],
                  "period": 60
                }
              },
              {
                "type": "metric",
                "x": 16,
                "y": 0,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "getById duration (ms)",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/Lambda", "Duration", "FunctionName", "${GetByIdFunctionName}", { "stat": "Average" } ],
                    [ ".", ".", ".", ".", { "stat": "Maximum" } ]
                  ],
                  "period": 60
                }
              }
            ]
          }
        - GetByIdFunctionName: !Ref getByIdFunction

Outputs:
  WebEndpoint:
    Description: API Gateway endpoint URL for Prod stage
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/'
  ObservabilityDashboardName:
    Description: CloudWatch dashboard for the live demo
    Value: !Ref ObservabilityDemoDashboard
  GetByIdDurationAlarmName:
    Description: CloudWatch alarm for elevated getById duration
    Value: !Ref GetByIdDurationAlarm
  GetByIdFunctionName:
    Description: Lambda function used for scenario=error and scenario=latency
    Value: !Ref getByIdFunction